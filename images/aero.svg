<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <filter id="glowAe">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgAe)"/>
  <!-- Aerodynamic Streamlines and Winglet -->
  <g transform="translate(100, 60)">
    <!-- Aerodynamic Wind Streams -->
    <path d="M 20 60 Q 150 50 380 90" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.4" stroke-dasharray="8,6"/>
    <path d="M 10 100 Q 140 90 390 140" fill="none" stroke="#00e5ff" stroke-width="4" opacity="0.7" stroke-dasharray="12,6"/>
    <path d="M 30 150 Q 130 150 400 200" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.4" stroke-dasharray="8,6"/>
    <!-- Fairing Nose Curve -->
    <path d="M 140 70 Q 200 65 240 100 L 220 220 L 130 200 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <!-- Winglet Aerofoil Foil -->
    <path d="M 180 120 Q 280 110 320 150 L 310 165 Q 260 140 180 145 Z" fill="#ff0055" filter="url(#glowAe)"/>
    <!-- Winglet Endplate -->
    <path d="M 310 130 L 330 145 L 325 180 L 305 165 Z" fill="#ff3366"/>
    <!-- Downforce Arrow -->
    <g transform="translate(260, 165)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#ffcc00" stroke-width="5" stroke-linecap="round"/>
      <polygon points="-8,45 0,65 8,45" fill="#ffcc00"/>
      <text x="15" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffcc00">DOWNFORCE</text>
    </g>
  </g>
  <text x="300" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">AERODYNAMIC WINGLETS & WIND TUNNEL FLOW</text>
</svg>
