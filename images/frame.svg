<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <filter id="glowFr">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgFr)"/>
  <!-- Trellis / Twin-spar Frame Geometry -->
  <g transform="translate(130, 80)">
    <!-- Steering Head -->
    <rect x="40" y="40" width="30" height="70" rx="8" fill="#4a5568" stroke="#00e5ff" stroke-width="4"/>
    <!-- Upper Main Spar -->
    <path d="M 65 60 L 220 120 L 260 210" fill="none" stroke="#00e5ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFr)"/>
    <!-- Lower Spar -->
    <path d="M 65 100 L 190 190 L 260 210" fill="none" stroke="#0099ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Trellis Cross Bracing -->
    <line x1="120" y1="80" x2="140" y2="155" stroke="#ff0055" stroke-width="5"/>
    <line x1="140" y1="155" x2="190" y2="110" stroke="#ff0055" stroke-width="5"/>
    <line x1="190" y1="110" x2="210" y2="190" stroke="#ff0055" stroke-width="5"/>
    <!-- Swingarm Pivot Boss -->
    <circle cx="260" cy="210" r="22" fill="#1a202c" stroke="#00e5ff" stroke-width="5"/>
    <circle cx="260" cy="210" r="10" fill="#fff"/>
    <!-- Rear Subframe Structure -->
    <path d="M 220 120 L 320 100 L 300 150 L 260 210" fill="none" stroke="#718096" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <text x="300" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">RIGID TWIN-SPAR & TRELLIS CHASSIS</text>
</svg>
