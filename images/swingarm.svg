<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="silverArm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgSw)"/>
  <!-- Sculpted Single-Sided / Inverted Swingarm -->
  <g transform="translate(100, 80)">
    <!-- Chassis Pivot Point -->
    <circle cx="80" cy="120" r="30" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="80" cy="120" r="14" fill="#0f172a" stroke="#fff" stroke-width="2"/>
    <!-- Upper Truss Arch / Banana Gull Wing -->
    <path d="M 80 100 Q 180 30 330 90 L 370 140 Q 240 100 80 140 Z" fill="url(#silverArm)" stroke="#334155" stroke-width="3"/>
    <!-- Main Lower Arm Beam -->
    <path d="M 80 130 Q 200 170 370 140 L 370 180 Q 200 210 80 150 Z" fill="url(#silverArm)" stroke="#475569" stroke-width="3"/>
    <!-- Shock Linkage Mount -->
    <path d="M 170 140 L 190 200 L 150 200 Z" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="170" cy="195" r="6" fill="#fff"/>
    <!-- Rear Hub Axle Eccentric Hub -->
    <circle cx="370" cy="160" r="42" fill="#0f172a" stroke="#ef4444" stroke-width="5"/>
    <circle cx="370" cy="160" r="20" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="370" cy="160" r="8" fill="#f8fafc"/>
  </g>
  <text x="300" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">SINGLE-SIDED SCULPTED ALUMINUM SWINGARM</text>
</svg>
