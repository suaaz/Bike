<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <filter id="glowBr">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgBr)"/>
  <!-- Perforated Rotor and Brembo Caliper -->
  <g transform="translate(180, 50)">
    <!-- Outer Rotor Track -->
    <circle cx="120" cy="150" r="120" fill="none" stroke="#64748b" stroke-width="26"/>
    <circle cx="120" cy="150" r="125" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="120" cy="150" r="105" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <!-- Rotor Drill Holes -->
    <g fill="#141824">
      <circle cx="60" cy="90" r="4"/><circle cx="80" cy="70" r="4"/><circle cx="110" cy="55" r="4"/><circle cx="140" cy="55" r="4"/><circle cx="170" cy="70" r="4"/>
      <circle cx="190" cy="95" r="4"/><circle cx="210" cy="130" r="4"/><circle cx="210" cy="170" r="4"/><circle cx="190" cy="205" r="4"/><circle cx="160" cy="230" r="4"/>
      <circle cx="120" cy="240" r="4"/><circle cx="80" cy="230" r="4"/><circle cx="50" cy="200" r="4"/><circle cx="40" cy="150" r="4"/><circle cx="50" cy="115" r="4"/>
    </g>
    <!-- Inner Hub Carrier -->
    <circle cx="120" cy="150" r="65" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <circle cx="120" cy="150" r="30" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <!-- Floating Rotor Buttons -->
    <circle cx="120" cy="75" r="8" fill="#e2e8f0" stroke="#000" stroke-width="2"/>
    <circle cx="185" cy="115" r="8" fill="#e2e8f0" stroke="#000" stroke-width="2"/>
    <circle cx="185" cy="185" r="8" fill="#e2e8f0" stroke="#000" stroke-width="2"/>
    <circle cx="120" cy="225" r="8" fill="#e2e8f0" stroke="#000" stroke-width="2"/>
    <circle cx="55" cy="185" r="8" fill="#e2e8f0" stroke="#000" stroke-width="2"/>
    <circle cx="55" cy="115" r="8" fill="#e2e8f0" stroke="#000" stroke-width="2"/>
    <!-- Radial Monobloc Caliper in Racing Red -->
    <path d="M 175 40 Q 255 60 265 140 L 225 155 Q 215 100 175 75 Z" fill="#ef4444" stroke="#fca5a5" stroke-width="3" filter="url(#glowBr)"/>
    <!-- Caliper Pistons / Brand Badge -->
    <circle cx="215" cy="95" r="14" fill="#991b1b" stroke="#fecaca" stroke-width="2"/>
    <circle cx="235" cy="125" r="12" fill="#991b1b" stroke="#fecaca" stroke-width="2"/>
    <text x="215" y="65" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" transform="rotate(35, 215, 65)">RADIAL 4-POT</text>
  </g>
  <text x="300" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">FLOATING ROTOR & MONOBLOC CALIPER</text>
</svg>
