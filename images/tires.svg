<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="carbonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgTi)"/>
  <!-- Tire, Carbon Rim, and Tread Grooves -->
  <g transform="translate(180, 50)">
    <!-- Outer Rubber Tread -->
    <circle cx="120" cy="150" r="130" fill="#090d16" stroke="#1e293b" stroke-width="4"/>
    <!-- Tire Sidewall -->
    <circle cx="120" cy="150" r="115" fill="#141a29"/>
    <!-- Yellow Brand Lettering Band -->
    <circle cx="120" cy="150" r="110" fill="none" stroke="#eab308" stroke-dasharray="20,120" stroke-width="3"/>
    <!-- Carbon Wheel Rim -->
    <circle cx="120" cy="150" r="85" fill="url(#carbonRim)" stroke="#475569" stroke-width="3"/>
    <!-- Lightweight Spokes (5-spoke star) -->
    <line x1="120" y1="150" x2="120" y2="70" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
    <line x1="120" y1="150" x2="195" y2="125" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
    <line x1="120" y1="150" x2="165" y2="215" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
    <line x1="120" y1="150" x2="75" y2="215" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
    <line x1="120" y1="150" x2="45" y2="125" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
    <!-- Hub Centering -->
    <circle cx="120" cy="150" r="26" fill="#020617" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Supercorsa Lightning Tread Grooves -->
    <path d="M 120 22 L 130 35 L 125 45" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <path d="M 215 70 L 225 85 L 215 95" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <path d="M 245 160 L 235 175 L 240 185" stroke="#38bdf8" stroke-width="3" fill="none"/>
  </g>
  <text x="300" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">RACE-COMPOUND SLICK & CARBON WHEEL</text>
</svg>
