<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="metalEng" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <filter id="glowEng">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgEng)"/>
  <!-- Engine Outline & Details -->
  <g transform="translate(150, 70)">
    <!-- Crankcase base -->
    <path d="M 50 180 Q 20 220 70 250 L 230 250 Q 280 220 250 180 Z" fill="#222736" stroke="#4a5568" stroke-width="4"/>
    <!-- Cylinder V-angle -->
    <path d="M 80 180 L 110 60 L 170 60 L 150 180 Z" fill="#2d3748" stroke="#ff3366" stroke-width="4"/>
    <path d="M 150 180 L 190 70 L 240 85 L 210 180 Z" fill="#1f2937" stroke="#ff6b35" stroke-width="4"/>
    <!-- Cooling Fins -->
    <line x1="95" y1="90" x2="165" y2="90" stroke="#ff3366" stroke-width="3" opacity="0.8"/>
    <line x1="90" y1="115" x2="160" y2="115" stroke="#ff3366" stroke-width="3" opacity="0.8"/>
    <line x1="85" y1="140" x2="155" y2="140" stroke="#ff3366" stroke-width="3" opacity="0.8"/>
    <!-- Cylinder Head Cap -->
    <rect x="105" y="45" width="70" height="20" rx="6" fill="#ff3366" filter="url(#glowEng)"/>
    <!-- Clutch Cover Circular -->
    <circle cx="200" cy="215" r="36" fill="#1a202c" stroke="#ff6b35" stroke-width="4"/>
    <circle cx="200" cy="215" r="20" fill="#2d3748" stroke="#fff" stroke-dasharray="4,4" stroke-width="2"/>
    <!-- Flame / Power pulse -->
    <path d="M 140 100 Q 150 70 160 100 Q 150 115 140 100 Z" fill="#ffcc00" opacity="0.9" filter="url(#glowEng)"/>
  </g>
  <text x="300" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">THE FOUR-CYLINDER POWERHOUSE</text>
</svg>
