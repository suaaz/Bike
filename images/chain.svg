<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="goldChain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgCh)"/>
  <!-- Front Countershaft Sprocket, Chain Loop, Rear Anodized Sprocket -->
  <g transform="translate(80, 80)">
    <!-- Rear Large Sprocket (Drilled lightening holes) -->
    <circle cx="360" cy="120" r="95" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
    <circle cx="360" cy="120" r="95" fill="none" stroke="#475569" stroke-width="8" stroke-dasharray="10,8"/>
    <circle cx="360" cy="120" r="40" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Sprocket Lightening Cutouts -->
    <circle cx="360" cy="65" r="16" fill="#141824"/>
    <circle cx="410" cy="95" r="16" fill="#141824"/>
    <circle cx="410" cy="145" r="16" fill="#141824"/>
    <circle cx="360" cy="175" r="16" fill="#141824"/>
    <circle cx="310" cy="145" r="16" fill="#141824"/>
    <circle cx="310" cy="95" r="16" fill="#141824"/>
    
    <!-- Small Front Countershaft Sprocket -->
    <circle cx="90" cy="120" r="38" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="90" cy="120" r="38" fill="none" stroke="#64748b" stroke-width="6" stroke-dasharray="8,6"/>
    <circle cx="90" cy="120" r="14" fill="#020617"/>
    
    <!-- Gold Chain Top Run -->
    <line x1="90" y1="82" x2="360" y2="25" stroke="url(#goldChain)" stroke-width="12" stroke-linecap="round"/>
    <line x1="90" y1="82" x2="360" y2="25" stroke="#000" stroke-width="2" stroke-dasharray="14,8"/>
    <!-- Gold Chain Bottom Run -->
    <line x1="90" y1="158" x2="360" y2="215" stroke="url(#goldChain)" stroke-width="12" stroke-linecap="round"/>
    <line x1="90" y1="158" x2="360" y2="215" stroke="#000" stroke-width="2" stroke-dasharray="14,8"/>
  </g>
  <text x="300" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">FINAL DRIVE GEAR RATIO & 520 RACE CHAIN</text>
</svg>
