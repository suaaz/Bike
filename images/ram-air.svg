<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <filter id="glowRa">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgRa)"/>
  <!-- Nose Snout Scoop, Sealed Airbox Duct, Pressurized Vortices -->
  <g transform="translate(120, 60)">
    <!-- High speed incoming air arrows -->
    <path d="M 20 140 L 70 140" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M 10 110 L 80 125" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M 10 170 L 80 155" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Aerodynamic Nose Scoop Opening -->
    <path d="M 80 80 Q 160 120 180 140 Q 160 160 80 200 L 100 240 Q 220 180 250 140 Q 220 100 100 40 Z" fill="#1e293b" stroke="#00e5ff" stroke-width="3" filter="url(#glowRa)"/>
    <!-- Internal Pressurized Airbox Chamber -->
    <path d="M 230 110 L 330 90 L 350 190 L 250 170 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
    <!-- Velocity Stacks (4 throttle intakes inside) -->
    <ellipse cx="280" cy="120" rx="12" ry="6" fill="#f59e0b"/>
    <ellipse cx="300" cy="135" rx="12" ry="6" fill="#f59e0b"/>
    <ellipse cx="320" cy="150" rx="12" ry="6" fill="#f59e0b"/>
    <!-- +15 HP Boost Marker -->
    <text x="290" y="240" font-family="sans-serif" font-size="16" font-weight="900" fill="#f59e0b" text-anchor="middle">+15 HP AT 180 MPH</text>
  </g>
  <text x="300" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">FORCED RAM-AIR PRESSURE DUCT</text>
</svg>
